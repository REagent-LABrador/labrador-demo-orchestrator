[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labrador-demo-orchestrator"
version = "0.1.0"
description = "Local, filesystem-backed demo orchestrator for REagent-LABrador modules"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
labrador-demo = "labrador_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labrador_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
